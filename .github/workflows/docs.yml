name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/**/src/**'
      - '.dockerignore'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun run --cwd apps/docs build

  # Deployment is owned by Dokploy (project "Framework", app "docs"): it
  # rebuilds apps/docs/Dockerfile on every push to main through the GitHub
  # provider. CI only proves the image builds.
  image:
    name: Build docs image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f apps/docs/Dockerfile -t framework-docs:ci .
