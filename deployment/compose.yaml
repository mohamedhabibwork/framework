# Local development and test infrastructure only. Credentials are placeholders.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: framework
      POSTGRES_PASSWORD: framework
      POSTGRES_DB: framework
    ports:
      - '127.0.0.1:54329:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U framework -d framework']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:63799:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    # Docker Hub no longer serves minio/minio. This image has no shell or curl for a healthcheck, so tests wait for it.
    image: cgr.dev/chainguard/minio@sha256:0a01100085e30fb08d2f39e39c9f5c9d83a95707f220b007d813b690cd41622d
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: framework
      MINIO_ROOT_PASSWORD: framework-secret
    ports:
      - '127.0.0.1:59000:9000'
